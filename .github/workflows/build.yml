name: Build Snapdragon Camera from ZIP
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Unzip Project
        run: |
          ZIP_FILE=$(find . -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found."
            exit 1
          else
            echo "Found ZIP file: $ZIP_FILE. Unzipping..."
            unzip -o "$ZIP_FILE" -d extracted_project
          fi

      - name: Setup Explicit Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Auto-Fix XML Strings and Product Attributes (Universal XML Tool)
        run: |
          # سكريبت بايثون متطور لتنظيف ملفات strings.xml وإزالة وسم product المتسبب في الخطأ
          python3 -c "
          import os, re
          import xml.etree.ElementTree as ET

          for root, dirs, files in os.walk('extracted_project'):
              for file in files:
                  if file == 'strings.xml':
                      file_path = os.path.join(root, file)
                      try:
                          # قراءة محتوى الملف معالجة الأخطاء الشائعة في الرموز
                          with open(file_path, 'r', encoding='utf-8') as f:
                              xml_data = f.read()
                          
                          # تنظيف الرموز التي قد تفسد الـ XML Parser مثل علامات & غير المفسرة
                          xml_data = re.sub(r'&(?!amp;|lt;|gt;|quot;|apos;)', '&amp;', xml_data)
                          
                          # وضع المحتوى داخل وسمResources موحد إذا كان تالفاً
                          if not xml_data.strip().startswith('<resources>'):
                              xml_data = '<resources>\n' + xml_data + '\n</resources>'
                          
                          root_xml = ET.fromstring(xml_data)
                          
                          seen_keys = set()
                          elements_to_remove = []
                          
                          for child in list(root_xml):
                              name_attr = child.get('name')
                              if not name_attr:
                                  elements_to_remove.append(child)
                                  continue
                              
                              # إزالة خاصية product المتسببة في خطأ (no default product defined) لجعل النص عاماً
                              if 'product' in child.attrib:
                                  del child.attrib['product']
                              
                              # إزالة التكرارات بشكل آمن تماماً
                              if name_attr in seen_keys:
                                  elements_to_remove.append(child)
                              else:
                                  seen_keys.add(name_attr)
                          
                          for elem in elements_to_remove:
                              root_xml.remove(elem)
                          
                          # حفظ الملف بعد التطهير الهيكلي الكامل
                          ET.indent(root_xml, space='    ', level=0)
                          with open(file_path, 'w', encoding='utf-8') as f:
                              f.write(ET.tostring(root_xml, encoding='utf-8').decode('utf-8'))
                              
                      except Exception as e:
                          # إذا كان الملف قديماً وتالفاً جداً برمجياً، نقوم بتنظيفه نصياً كخيار احتياطي آمن
                          try:
                              with open(file_path, 'r', encoding='utf-8') as f:
                                  content = f.read()
                              content = re.sub(r'product=\"[^\"]+\"', '', content) # مسح الوسم نصياً
                              # تنظيف التكرارات نصياً بأسلوب محافظ
                              seen = set()
                              lines = content.splitlines()
                              final_lines = []
                              for line in lines:
                                  m = re.search(r'name=\"([^\"]+)\"', line)
                                  if m and m.group(1) in seen:
                                      continue
                                  if m: seen.add(m.group(1))
                                  final_lines.append(line)
                              with open(file_path, 'w', encoding='utf-8') as f:
                                  f.write('\n'.join(final_lines))
                          except Exception as inner_e:
                              print(f'Error processing {file_path}: {inner_e}')
          "

      - name: Clean Layout Framework IDs
        run: |
          python3 -c "
          import os
          for root, dirs, files in os.walk('extracted_project'):
              for file in files:
                  if file == 'preference.xml':
                      file_path = os.path.join(root, file)
                      with open(file_path, 'r', encoding='utf-8') as f:
                          data = f.read()
                      
                      data = data.replace('android:id=\"@android:id/icon\"', 'android:id=\"@+id/icon\"')
                      data = data.replace('android:id=\"@android:id/title\"', 'android:id=\"@+id/title\"')
                      data = data.replace('android:id=\"@android:id/summary\"', 'android:id=\"@+id/summary\"')
                      data = data.replace('android:id=\"@android:id/widget_frame\"', 'android:id=\"@+id/widget_frame\"')
                      
                      data = data.replace('android:id=\"@+android:id/icon\"', 'android:id=\"@+id/icon\"')
                      data = data.replace('android:id=\"@+android:id/title\"', 'android:id=\"@+id/title\"')
                      data = data.replace('android:id=\"@+android:id/summary\"', 'android:id=\"@+id/summary\"')
                      data = data.replace('android:id=\"@+android:id/widget_frame\"', 'android:id=\"@+id/widget_frame\"')
                      
                      with open(file_path, 'w', encoding='utf-8') as f:
                          f.write(data)
          "

      - name: Fix Manifest Package and Sync Gradle Layout
        run: |
          cd extracted_project
          TARGET_DIR=$(find . -name "AndroidManifest.xml" ! -path "*/tests/*" -exec dirname {} \; | head -n 1)
          cd "$TARGET_DIR"
          
          sed -i 's/package="org.codeaurora.snapcam"//g' AndroidManifest.xml
          
          echo "Writing clean build.gradle layout..."
          echo -e "buildscript {\n    repositories { google(); mavenCentral() }\n    dependencies { classpath 'com.android.tools.build:gradle:8.1.0' }\n}\nallprojects {\n    repositories { google(); mavenCentral() }\n}\napply plugin: 'com.android.application'\nandroid {\n    compileSdk 27\n    namespace \"org.codeaurora.snapcam\"\n    \n    defaultConfig {\n        applicationId \"org.codeaurora.snapcam\"\n        minSdk 21\n        targetSdk 27\n        versionCode 1\n        versionName \"1.0\"\n    }\n    \n    aaptOptions {\n        additionalParameters '--allow-reserved-package-id', '--package-id', '0x7f'\n    }\n    \n    sourceSets {\n        main {\n            manifest.srcFile 'AndroidManifest.xml'\n            java.srcDirs = ['src', 'src_pd', 'src_pd_gcam']\n            res.srcDirs = ['res']\n            assets.srcDirs = ['assets']\n        }\n    }\n}" > build.gradle

          echo "rootProject.name = 'SnapCamera'" > settings.gradle

      - name: Build APK with Clean Gradle 8.4
        run: |
          cd extracted_project
          TARGET_DIR=$(find . -name "AndroidManifest.xml" ! -path "*/tests/*" -exec dirname {} \; | head -n 1)
          cd "$TARGET_DIR"
          
          gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Snap-Camera-APK
          path: "**/build/outputs/apk/**/*.apk"
