name: Build Snapdragon Camera from ZIP
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Unzip Project
        run: |
          ZIP_FILE=$(find . -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found."
            exit 1
          else
            echo "Found ZIP file: $ZIP_FILE. Unzipping..."
            unzip -o "$ZIP_FILE" -d extracted_project
          fi

      - name: Setup Explicit Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Auto-Fix All Duplicate Strings (Universal Python Tool)
        run: |
          python3 -c "
          import os, re
          for root, dirs, files in os.walk('extracted_project'):
              for file in files:
                  if file == 'strings.xml':
                      file_path = os.path.join(root, file)
                      try:
                          with open(file_path, 'r', encoding='utf-8') as f:
                              content = f.read()
                          seen_names = set()
                          cleaned_lines = []
                          lines = content.splitlines()
                          for line in lines:
                              match = re.search(r'name=\"([^\"]+)\"', line)
                              if match:
                                  name = match.group(1)
                                  if name in seen_names:
                                      continue
                                  else:
                                      seen_names.add(name)
                                      cleaned_lines.append(line)
                              else:
                                  cleaned_lines.append(line)
                          with open(file_path, 'w', encoding='utf-8') as f:
                              f.write('\n'.join(cleaned_lines))
                      except Exception as e:
                          print(f'Skipped file {file_path}: {e}')
          "

      - name: Clean Layout Framework IDs and Pre-process Code
        run: |
          # أداة بايثون للبحث الشامل عن ملف preference.xml وتعديل المعرفات المرفوضة
          python3 -c "
          import os
          for root, dirs, files in os.walk('extracted_project'):
              for file in files:
                  if file == 'preference.xml':
                      file_path = os.path.join(root, file)
                      print(f'Found layout file to patch: {file_path}')
                      with open(file_path, 'r', encoding='utf-8') as f:
                          data = f.read()
                      
                      # استبدال المعرفات التالفة لنظام أندرويد الخارجي بمعرفات محلية عادية تتماشى مع AAPT2
                      data = data.replace('android:id=\"@android:id/icon\"', 'android:id=\"@+id/icon\"')
                      data = data.replace('android:id=\"@android:id/title\"', 'android:id=\"@+id/title\"')
                      data = data.replace('android:id=\"@android:id/summary\"', 'android:id=\"@+id/summary\"')
                      data = data.replace('android:id=\"@android:id/widget_frame\"', 'android:id=\"@+id/widget_frame\"')
                      
                      data = data.replace('android:id=\"@+android:id/icon\"', 'android:id=\"@+id/icon\"')
                      data = data.replace('android:id=\"@+android:id/title\"', 'android:id=\"@+id/title\"')
                      data = data.replace('android:id=\"@+android:id/summary\"', 'android:id=\"@+id/summary\"')
                      data = data.replace('android:id=\"@+android:id/widget_frame\"', 'android:id=\"@+id/widget_frame\"')
                      
                      with open(file_path, 'w', encoding='utf-8') as f:
                          f.write(data)
          "

      - name: Fix Manifest Package and Sync Gradle Layout
        run: |
          cd extracted_project
          TARGET_DIR=$(find . -name "AndroidManifest.xml" ! -path "*/tests/*" -exec dirname {} \; | head -n 1)
          cd "$TARGET_DIR"
          
          echo "Removing package attribute from source AndroidManifest.xml..."
          sed -i 's/package="org.codeaurora.snapcam"//g' AndroidManifest.xml
          
          echo "Writing clean build.gradle layout..."
          echo -e "buildscript {\n    repositories { google(); mavenCentral() }\n    dependencies { classpath 'com.android.tools.build:gradle:8.1.0' }\n}\nallprojects {\n    repositories { google(); mavenCentral() }\n}\napply plugin: 'com.android.application'\nandroid {\n    compileSdk 27\n    namespace \"org.codeaurora.snapcam\"\n    \n    defaultConfig {\n        applicationId \"org.codeaurora.snapcam\"\n        minSdk 21\n        targetSdk 27\n        versionCode 1\n        versionName \"1.0\"\n    }\n    \n    aaptOptions {\n        additionalParameters '--allow-reserved-package-id', '--package-id', '0x7f'\n    }\n    \n    sourceSets {\n        main {\n            manifest.srcFile 'AndroidManifest.xml'\n            java.srcDirs = ['src', 'src_pd', 'src_pd_gcam']\n            res.srcDirs = ['res']\n            assets.srcDirs = ['assets']\n        }\n    }\n}" > build.gradle

          echo "rootProject.name = 'SnapCamera'" > settings.gradle

      - name: Build APK with Clean Gradle 8.4
        run: |
          cd extracted_project
          TARGET_DIR=$(find . -name "AndroidManifest.xml" ! -path "*/tests/*" -exec dirname {} \; | head -n 1)
          cd "$TARGET_DIR"
          
          gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Snap-Camera-APK
          path: "**/build/outputs/apk/**/*.apk"
