name: Build Snapdragon Camera from ZIP
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Unzip Project
        run: |
          ZIP_FILE=$(find . -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found."
            exit 1
          else
            echo "Found ZIP file: $ZIP_FILE. Unzipping..."
            unzip -o "$ZIP_FILE" -d extracted_project
          fi

      - name: Setup Explicit Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Robust Python Automation (Bulletproof Stateful Strings Deduplication, Camera2 & Source Discovery)
        run: |
          python3 -c "
          import os, re

          target_dir = '.'
          for root, dirs, files in os.walk('extracted_project'):
              if 'AndroidManifest.xml' in files and 'tests' not in root:
                  target_dir = root
                  break

          print(f'Working target directory: {target_dir}')
          os.chdir(target_dir)

          # 1. Bulletproof Stateful Regex Deduplication for ALL strings.xml files
          for root, dirs, files in os.walk('.'):
              for file in files:
                  if file == 'strings.xml':
                      path = os.path.join(root, file)
                      try:
                        with open(path, 'r', encoding='utf-8') as f:
                            content = f.read()

                        # Remove product attributes everywhere first
                        content = re.sub(r'\bproduct=[\"\'][^\"\']*[\"\']', '', content)

                        seen_names = set()

                        def clean_tag(match):
                            full_tag = match.group(0)
                            name_match = re.search(r'\bname=[\"\']([^\"\']+)[\"\']', full_tag)
                            if name_match:
                                name = name_match.group(1)
                                if name in seen_names:
                                    return ''  # Remove duplicate tag entirely
                                seen_names.add(name)
                            return full_tag

                        # Match any single-line or multi-line XML resource tag containing a name attribute
                        pattern = re.compile(r'<[a-zA-Z0-9_-]+\b[^>]*\bname=[\"\'][^\"\']+[\"\'][^>]*(?:/>|>.*?</[a-zA-Z0-9_-]+\s*>)', re.DOTALL)
                        cleaned_content = pattern.sub(clean_tag, content)

                        with open(path, 'w', encoding='utf-8') as f:
                            f.write(cleaned_content)
                        print(f'Successfully state-cleaned and deduplicated: {path}')
                      except Exception as e:
                        print(f'Warning: failed to deduplicate {path}: {e}')

          # 2. Enable Camera API 2 in XML configurations
          for root, dirs, files in os.walk('.'):
              for file in files:
                  if file.endswith('.xml'):
                      path = os.path.join(root, file)
                      try:
                          with open(path, 'r', encoding='utf-8') as f:
                              content = f.read()
                          
                          updated = content
                          updated = updated.replace(
                              '<bool name=\"support_camera_api_v2\">false</bool>',
                              '<bool name=\"support_camera_api_v2\">true</bool>'
                          )
                          updated = updated.replace(
                              '<bool name=\"camera2_support\">false</bool>',
                              '<bool name=\"camera2_support\">true</bool>'
                          )
                          
                          if updated != content:
                              with open(path, 'w', encoding='utf-8') as f:
                                  f.write(updated)
                      except Exception:
                          pass

          # 3. Patch CameraActivity.java to force Camera2 selection logic
          for root, dirs, files in os.walk('.'):
              for file in files:
                  if file == 'CameraActivity.java':
                      path = os.path.join(root, file)
                      try:
                          with open(path, 'r', encoding='utf-8') as f:
                              content = f.read()
                          
                          updated = content
                          updated = updated.replace('mCamera2enabled = false', 'mCamera2enabled = mCamera2supported')
                          
                          if updated != content:
                              with open(path, 'w', encoding='utf-8') as f:
                                  f.write(updated)
                      except Exception:
                          pass

          # 4. Dynamically discover all directories containing .java source files
          java_dirs = set()
          for root, dirs, files in os.walk('.'):
              if any(f.endswith('.java') for f in files):
                rel_path = root.replace('\\\\', '/')
                if rel_path.startswith('./'):
                    rel_path = rel_path[2:]
                if rel_path == '':
                    rel_path = '.'
                java_dirs.add(rel_path)

          if not java_dirs:
              java_dirs = {'src'}

          print(f'Discovered Java Source Directories: {sorted(java_dirs)}')

          with open('/tmp/java_src_dirs.txt', 'w') as f:
              f.write(', '.join([f\"'{d}'\" for d in sorted(java_dirs)]))
          "

      - name: Fix Framework IDs in Preference Layouts
        run: |
          cd extracted_project
          echo "Searching for preference.xml files to normalize IDs..."
          find . -name "preference.xml" | while read -r file; do
            sed -i 's/@android:id\//@+id\//g' "$file"
            sed -i 's/@+android:id\//@+id\//g' "$file"
          done

      - name: Stub Missing Resources, Styles & Drawables
        run: |
          cd extracted_project
          TARGET_DIR=$(find . -name "AndroidManifest.xml" ! -path "*/tests/*" -exec dirname {} \; | head -n 1)
          cd "$TARGET_DIR"

          mkdir -p res/values
          if [ -f res/values/strings.xml ]; then
            sed -i '/<\/resources>/i \    <string name="quick_reader_name">Snap QR Reader</string>' res/values/strings.xml
          else
            echo -e "<resources>\n    <string name=\"quick_reader_name\">Snap QR Reader</string>\n</resources>" > res/values/strings.xml
          fi

          if [ -f res/values/styles.xml ]; then
            sed -i '/<\/resources>/i \    <style name="AppTheme" parent="android:Theme.Material.Light.DarkActionBar" />' res/values/styles.xml
          else
            echo -e "<resources>\n    <style name=\"AppTheme\" parent=\"android:Theme.Material.Light.DarkActionBar\" />\n</resources>" > res/values/styles.xml
          fi

          mkdir -p res/drawable
          if [ ! -f res/drawable/ic_event.xml ]; then
            echo -e '<vector xmlns:android="http://schemas.android.com/apk/res/android"\n    android:width="24dp"\n    android:height="24dp"\n    android:viewportWidth="24"\n    android:viewportHeight="24">\n  <path\n      android:fillColor="#FF000000"\n      android:pathData="M19,3H18V1H16V3H8V1H6V3H5C3.89,3 3,3.9 3,5V19C3,20.1 3.89,21 5,21H19C20.1,21 21,20.1 21,19V5C21,3.9 20.1,3 19,3M19,19H5V8H19V19Z"/>\n</vector>' > res/drawable/ic_event.xml
          fi

          mkdir -p src/android/os
          echo -e "package android.os;\npublic class SystemProperties {\n    public static String get(String key) { return \"\"; }\n    public static String get(String key, String def) { return def; }\n    public static int getInt(String key, int def) { return def; }\n    public static boolean getBoolean(String key, boolean def) { return def; }\n}" > src/android/os/SystemProperties.java

          mkdir -p src/android/media
          echo -e "package android.media;\nimport java.util.ArrayList;\nimport java.util.List;\npublic class EncoderCapabilities {\n    public static class VideoEncoderCap {\n        public int mCodec;\n        public int mMinBitRate; public int mMaxBitRate;\n        public int mMinFrameRate; public int mMaxFrameRate;\n        public int mMinFrameWidth; public int mMaxFrameWidth;\n        public int mMinFrameHeight; public int mMaxFrameHeight;\n    }\n    public static List<VideoEncoderCap> getVideoEncoders() { return new ArrayList<>(); }\n}" > src/android/media/EncoderCapabilities.java

      - name: Fix Manifest Package and Generate Robust Gradle Layout
        run: |
          cd extracted_project
          TARGET_DIR=$(find . -name "AndroidManifest.xml" ! -path "*/tests/*" -exec dirname {} \; | head -n 1)
          cd "$TARGET_DIR"
          
          sed -i 's/package="org.codeaurora.snapcam"//g' AndroidManifest.xml
          
          JAVA_DIRS_STRING=$(cat /tmp/java_src_dirs.txt)
          echo "Injecting dynamic Java source directories: [${JAVA_DIRS_STRING}]"

          echo "Writing clean build.gradle layout..."
          echo -e "buildscript {\n    repositories { google(); mavenCentral() }\n    dependencies { classpath 'com.android.tools.build:gradle:8.1.0' }\n}\nallprojects {\n    repositories { google(); mavenCentral() }\n}\napply plugin: 'com.android.application'\nandroid {\n    compileSdk 27\n    namespace \"org.codeaurora.snapcam\"\n    \n    defaultConfig {\n        applicationId \"org.codeaurora.snapcam\"\n        minSdk 21\n        targetSdk 27\n        versionCode 1\n        versionName \"1.0\"\n    }\n    \n    aaptOptions {\n        additionalParameters '--allow-reserved-package-id', '--package-id', '0x7f'\n    }\n    \n    sourceSets {\n        main {\n            manifest.srcFile 'AndroidManifest.xml'\n            java.srcDirs = [${JAVA_DIRS_STRING}]\n            res.srcDirs = ['res']\n            assets.srcDirs = ['assets']\n        }\n    }\n}\ndependencies {\n    implementation 'com.adobe.xmp:xmpcore:6.1.11'\n    implementation 'com.android.support:support-v4:27.1.1'\n}" > build.gradle

          echo "rootProject.name = 'SnapCamera'" > settings.gradle

      - name: Build APK with Clean Gradle 8.4
        run: |
          cd extracted_project
          TARGET_DIR=$(find . -name "AndroidManifest.xml" ! -path "*/tests/*" -exec dirname {} \; | head -n 1)
          cd "$TARGET_DIR"
          
          gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Snap-Camera-APK
          path: "**/build/outputs/apk/**/*.apk"
