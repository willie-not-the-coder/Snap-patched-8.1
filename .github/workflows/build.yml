name: Build Snapdragon Camera from ZIP
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Unzip Project
        run: |
          ZIP_FILE=$(find . -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found."
            exit 1
          else
            echo "Found ZIP file: $ZIP_FILE. Unzipping..."
            unzip -o "$ZIP_FILE" -d extracted_project
          fi

      - name: Setup Explicit Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Auto-Fix XML Strings and Product Attributes (Universal XML Tool)
        run: |
          python3 -c "
          import os, re
          import xml.etree.ElementTree as ET

          for root, dirs, files in os.walk('extracted_project'):
              for file in files:
                  if file == 'strings.xml':
                      file_path = os.path.join(root, file)
                      try:
                          with open(file_path, 'r', encoding='utf-8') as f:
                              xml_data = f.read()
                          
                          xml_data = re.sub(r'&(?!amp;|lt;|gt;|quot;|apos;)', '&amp;', xml_data)
                          if not xml_data.strip().startswith('<resources>'):
                              xml_data = '<resources>\n' + xml_data + '\n</resources>'
                          
                          root_xml = ET.fromstring(xml_data)
                          seen_keys = set()
                          elements_to_remove = []
                          
                          for child in list(root_xml):
                              name_attr = child.get('name')
                              if not name_attr:
                                  elements_to_remove.append(child)
                                  continue
                              if 'product' in child.attrib:
                                  del child.attrib['product']
                              if name_attr in seen_keys:
                                  elements_to_remove.append(child)
                              else:
                                  seen_keys.add(name_attr)
                          
                          for elem in elements_to_remove:
                              root_xml.remove(elem)
                          
                          ET.indent(root_xml, space='    ', level=0)
                          with open(file_path, 'w', encoding='utf-8') as f:
                              f.write(ET.tostring(root_xml, encoding='utf-8').decode('utf-8'))
                      except Exception as e:
                          try:
                              with open(file_path, 'r', encoding='utf-8') as f:
                                  content = f.read()
                              content = re.sub(r'product=\"[^\"]+\"', '', content)
                              seen = set()
                              lines = content.splitlines()
                              final_lines = []
                              for line in lines:
                                  m = re.search(r'name=\"([^\"]+)\"', line)
                                  if m and m.group(1) in seen:
                                      continue
                                  if m: seen.add(m.group(1))
                                  final_lines.append(line)
                              with open(file_path, 'w', encoding='utf-8') as f:
                                  f.write('\n'.join(final_lines))
                          except Exception as inner_e:
                              print(f'Error processing {file_path}: {inner_e}')
          "

      - name: Clean Layout Framework IDs, Stub Resources and Enable Camera API 2
        run: |
          cd extracted_project
          TARGET_DIR=$(find . -name "AndroidManifest.xml" ! -path "*/tests/*" -exec dirname {} \; | head -n 1)
          cd "$TARGET_DIR"

          if [ -f res/layout/preference.xml ]; then
            sed -i 's/android:id=\"@android:id\/icon\"/android:id=\"@+id\/icon\"/g' res/layout/preference.xml
            sed -i 's/android:id=\"@android:id\/title\"/android:id=\"@+id\/title\"/g' res/layout/preference.xml
            sed -i 's/android:id=\"@android:id\/summary\"/android:id=\"@+id\/summary\"/g' res/layout/preference.xml
            sed -i 's/android:id=\"@android:id\/widget_frame\"/android:id=\"@+id\/widget_frame\"/g' res/layout/preference.xml
            sed -i 's/android:id=\"@+android:id\/icon\"/android:id=\"@+id\/icon\"/g' res/layout/preference.xml
            sed -i 's/android:id=\"@+android:id\/title\"/android:id=\"@+id\/title\"/g' res/layout/preference.xml
            sed -i 's/android:id=\"@+android:id\/summary\"/android:id=\"@+id\/summary\"/g' res/layout/preference.xml
            sed -i 's/android:id=\"@+android:id\/widget_frame\"/android:id=\"@+id\/widget_frame\"/g' res/layout/preference.xml
          fi

          mkdir -p res/values
          if [ -f res/values/strings.xml ]; then
            sed -i '/<\/resources>/i \    <string name="quick_reader_name">Snap QR Reader</string>' res/values/strings.xml
          else
            echo -e "<resources>\n    <string name=\"quick_reader_name\">Snap QR Reader</string>\n</resources>" > res/values/strings.xml
          fi

          if [ -f res/values/styles.xml ]; then
            sed -i '/<\/resources>/i \    <style name="AppTheme" parent="android:Theme.Material.Light.DarkActionBar" />' res/values/styles.xml
          else
            echo -e "<resources>\n    <style name=\"AppTheme\" parent=\"android:Theme.Material.Light.DarkActionBar\" />\n</resources>" > res/values/styles.xml
          fi

          # تفعيل Camera API 2 برمجياً في الكود والموارد المستخرجة تلقائياً
          echo "Patching source code to enable Camera API 2..."
          find . -name "PersistUtil.java" -exec sed -i 's/PERSIST_CAMERA_HAL3_ENABLE, "0"/PERSIST_CAMERA_HAL3_ENABLE, "1"/g' {} \;
          find . -name "PersistUtil.java" -exec sed -i 's/camera2.enable", false/camera2.enable", true/g' {} \;
          find . -name "*.xml" -exec sed -i 's/<bool name="config_camera2_enable">false<\/bool>/<bool name="config_camera2_enable">true<\/bool>/g' {} \;

          mkdir -p src/android/os
          echo -e "package android.os;\npublic class SystemProperties {\n    public static String get(String key) { return \"\"; }\n    public static String get(String key, String def) { return def; }\n    public static int getInt(String key, int def) { return def; }\n    public static boolean getBoolean(String key, boolean def) { return def; }\n}" > src/android/os/SystemProperties.java

          mkdir -p src/android/media
          echo -e "package android.media;\nimport java.util.ArrayList;\nimport java.util.List;\npublic class EncoderCapabilities {\n    public static class VideoEncoderCap {\n        public int mCodec;\n        public int mMinBitRate; public int mMaxBitRate;\n        public int mMinFrameRate; public int mMaxFrameRate;\n        public int mMinFrameWidth; public int mMaxFrameWidth;\n        public int mMinFrameHeight; public int mMaxFrameHeight;\n    }\n    public static List<VideoEncoderCap> getVideoEncoders() { return new ArrayList<>(); }\n}" > src/android/media/EncoderCapabilities.java

      - name: Fix Manifest Package and Sync Gradle Layout
        run: |
          cd extracted_project
          TARGET_DIR=$(find . -name "AndroidManifest.xml" ! -path "*/tests/*" -exec dirname {} \; | head -n 1)
          cd "$TARGET_DIR"
          
          sed -i 's/package="org.codeaurora.snapcam"//g' AndroidManifest.xml
          
          echo "Writing clean build.gradle layout..."
          echo -e "buildscript {\n    repositories { google(); mavenCentral() }\n    dependencies { classpath 'com.android.tools.build:gradle:8.1.0' }\n}\nallprojects {\n    repositories { google(); mavenCentral() }\n}\napply plugin: 'com.android.application'\nandroid {\n    compileSdk 27\n    namespace \"org.codeaurora.snapcam\"\n    \n    defaultConfig {\n        applicationId \"org.codeaurora.snapcam\"\n        minSdk 21\n        targetSdk 27\n        versionCode 1\n        versionName \"1.0\"\n    }\n    \n    aaptOptions {\n        additionalParameters '--allow-reserved-package-id', '--package-id', '0x7f'\n    }\n    \n    tasks.withType(JavaCompile) {\n        options.failOnError = false\n    }\n    \n    sourceSets {\n        main {\n            manifest.srcFile 'AndroidManifest.xml'\n            java.srcDirs = ['src', 'src_pd', 'src_pd_gcam']\n            res.srcDirs = ['res']\n            assets.srcDirs = ['assets']\n        }\n    }\n}\ndependencies {\n    implementation 'com.adobe.xmp:xmpcore:6.1.11'\n    implementation 'com.android.support:support-v4:27.1.1'\n}" > build.gradle

          echo "rootProject.name = 'SnapCamera'" > settings.gradle

      - name: Build APK with Clean Gradle 8.4
        run: |
          cd extracted_project
          TARGET_DIR=$(find . -name "AndroidManifest.xml" ! -path "*/tests/*" -exec dirname {} \; | head -n 1)
          cd "$TARGET_DIR"
          
          gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact
        with:
          name: Snap-Camera-APK
          path: "**/build/outputs/apk/**/*.apk"
